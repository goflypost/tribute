<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .tag { color: #666; margin: 0 0 12px; font-size: 12px; }
      fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 0 0 12px; }
      legend { font-weight: 600; font-size: 12px; padding: 0 4px; }
      label { display: block; padding: 3px 0; cursor: pointer; }
      .meta { color: #888; font-size: 11px; }
      ul { margin: 4px 0 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <h1>Tribute</h1>
    <p class="tag">The web, without the untested apps.</p>
    <fieldset>
      <legend>Flagged listings are…</legend>
      <label><input type="radio" name="strictness" value="label" /> labeled — just tell me</label>
      <label><input type="radio" name="strictness" value="dim" /> dimmed — de-emphasize them</label>
      <label><input type="radio" name="strictness" value="hide" /> hidden — I never want to see them</label>
    </fieldset>
    <fieldset>
      <legend>Inspection</legend>
      <label><input type="checkbox" id="deepScan" /> fetch linked app pages for HTML signals</label>
      <div class="meta">Off by default. Turning it on asks Chrome for access to linked app pages.</div>
    </fieldset>
    <div class="meta" id="status">loading…</div>
    <div class="meta" id="lists"></div>
    <script src="popup.js"></script>
  </body>
</html>
